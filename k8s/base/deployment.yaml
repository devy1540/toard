# toard 앱 (Next.js standalone). 무중단 롤링 배포 (ADR-001):
#   maxUnavailable=0 + 프로브로 준비된 파드만 트래픽 수신, preStop 으로 수집(OTLP) 드레인.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toard-app
  labels:
    app: toard-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # 항상 최소 replicas 유지 → 무중단
      maxSurge: 1
  selector:
    matchLabels:
      app: toard-app
  template:
    metadata:
      labels:
        app: toard-app
    spec:
      terminationGracePeriodSeconds: 40
      initContainers:
        # DB 연결 대기 → 스키마 마이그레이션(멱등, node-pg-migrate 락으로 멀티파드 안전) → 앱 기동
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -U $POSTGRES_USER; do sleep 2; done"]
          env:
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: toard-config, key: POSTGRES_USER } }
        - name: migrate
          image: toard-migrate:0.0.1
          command: ["sh", "-c", "pnpm migrate && pnpm seed"] # 마이그레이션 + baseline(providers·pricing). admin 은 /setup.
          # browser setup token을 포함한 runtime Secret은 app에만 준다.
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: toard-secrets, key: DATABASE_URL } }
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: toard-secrets, key: BOOTSTRAP_ADMIN_EMAIL, optional: true } }
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: toard-secrets, key: BOOTSTRAP_ADMIN_PASSWORD, optional: true } }
          envFrom:
            - configMapRef:
                name: toard-config
      containers:
        - name: app
          image: toard:0.0.1
          ports:
            - containerPort: 3000
          # runtime에 필요한 key만 명시적으로 주입한다. bootstrap admin/PG 비밀번호는 app에 주지 않는다.
          env:
            - name: AUTH_SECRET
              valueFrom: { secretKeyRef: { name: toard-secrets, key: AUTH_SECRET } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: toard-secrets, key: DATABASE_URL } }
            - name: CRON_SECRET
              valueFrom: { secretKeyRef: { name: toard-secrets, key: CRON_SECRET } }
            - name: AUTH_GITHUB_ID
              valueFrom: { secretKeyRef: { name: toard-secrets, key: AUTH_GITHUB_ID, optional: true } }
            - name: AUTH_GITHUB_SECRET
              valueFrom: { secretKeyRef: { name: toard-secrets, key: AUTH_GITHUB_SECRET, optional: true } }
            - name: AUTH_GOOGLE_ID
              valueFrom: { secretKeyRef: { name: toard-secrets, key: AUTH_GOOGLE_ID, optional: true } }
            - name: AUTH_GOOGLE_SECRET
              valueFrom: { secretKeyRef: { name: toard-secrets, key: AUTH_GOOGLE_SECRET, optional: true } }
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: toard-secrets, key: CLICKHOUSE_PASSWORD, optional: true } }
            - name: BOOTSTRAP_SETUP_TOKEN
              valueFrom: { secretKeyRef: { name: toard-secrets, key: BOOTSTRAP_SETUP_TOKEN, optional: true } }
          envFrom:
            - configMapRef:
                name: toard-config
          startupProbe: # 초기 기동 대기 (최대 60s)
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe: # DB 연결 가능할 때만 트래픽 수신
            httpGet:
              path: /api/ready
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe: # 프로세스 헬스 (DB 무관 — 재시작 루프 방지)
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 15
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"] # 엔드포인트 제거 후 in-flight OTLP 드레인
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
